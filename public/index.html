<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge Outreach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Night desk: slate, not black; the three lead types carry the colour. */
  :root {
    color-scheme: dark;
    --bg: #1B1F27; --panel: #222731; --raise: #282E3A; --ink: #E7EAF0; --muted: #8B93A3; --line: #2E3440; --line2: #3A4150;
    --accent: #E7EAF0; --accent-ink: #1B1F27; --soft: #2A3140; --warn: #F2B45A; --warn-bg: #3a2f1c;
    --danger: #FF7A6B; --radius: 8px;
    --inv: #7EA6FF; --inv-bg: #233154; --par: #C49BFF; --par-bg: #33264b; --con: #F2B45A; --con-bg: #3d2f1b; --com: #5FD0C5; --com-bg: #1d3a39;
    --hot: #FF8A5C; --good: #6FD3A0; --good-bg: #1f3a30;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13.5px/1.5 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
  body.docked .app { grid-template-columns: 210px 1fr 420px; }
  nav { background: var(--bg); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  nav h1 { font-size: 15px; margin: 0 8px 4px; letter-spacing: -0.01em; }
  nav p { margin: 0 8px 18px; color: var(--muted); font-size: 12px; }
  nav button { display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  nav button { color: var(--muted); }
  nav button:hover { background: var(--panel); color: var(--ink); }
  nav button.on { background: var(--panel); color: var(--ink); font-weight: 500; }
  nav .new { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: #2c3a5c; color: #a9c1ff; margin-left: 6px; }
  nav .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  nav .mode { position: absolute; bottom: 18px; left: 22px; right: 14px; font-size: 12px; color: var(--muted); }
  main { padding: 26px 30px 60px; min-width: 0; }
  h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.015em; }
  .sub { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .bar .grow { flex: 1; }
  input[type=text], input[type=email], input[type=url], input[type=search], input[type=number], select, textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--panel); width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { resize: vertical; min-height: 80px; line-height: 1.45; }
  .bar input[type=search] { width: 240px; }
  .bar select { width: auto; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; text-decoration: none; color: inherit; display: inline-block; }
  .btn:hover { border-color: var(--line2); background: var(--raise); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(0.92); background: var(--accent); }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .tabs button { border: 0; background: none; padding: 7px 12px; cursor: pointer; }
  .tabs button { color: var(--muted); }
  .tabs button.on { background: var(--soft); color: var(--ink); font-weight: 500; }
  .stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 16px; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; text-align: left; }
  .stage.on { border-color: var(--line2); background: var(--soft); }
  .stage b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stage span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; }
  th:last-child, td:last-child { border-right: 0; }
  tr.sel td { background: #262c38; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--panel); }
  td .org { font-weight: 500; }
  .who { color: var(--muted); font-size: 13px; }
  td.fit { color: var(--muted); max-width: 320px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 5px; font-size: 12px; background: var(--soft); border: 0; white-space: nowrap; color: var(--ink); }
  .pill.investor { background: var(--inv-bg); color: var(--inv); }
  .pill.partner { background: var(--par-bg); color: var(--par); }
  .pill.conference { background: var(--con-bg); color: var(--con); }
  .pill.community { background: var(--com-bg); color: var(--com); }
  /* Score reads as a grade with a heat word, like a ledger entry. */
  .score { display: inline-flex; gap: 6px; align-items: baseline; padding: 1px 8px; border: 1px solid var(--line); border-radius: 6px; font-weight: 600; font-size: 13px; cursor: help; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .score i { font-style: normal; font-weight: 500; font-size: 12px; }
  .score.hot i { color: var(--hot); } .score.warm i { color: var(--con); } .score.cold i { color: var(--muted); }
  .pill.s-Contacted { background: var(--warn-bg); color: var(--warn); }
  .pill.s-Replied, .pill.s-Meeting { background: var(--good-bg); color: var(--good); }
  .pill.s-Passed { color: var(--muted); }
  .have { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .have i { font-style: normal; opacity: 0.35; margin-right: 6px; }
  .have i.yes { opacity: 1; color: var(--good); font-weight: 600; }
  .empty { background: var(--bg); border: 1px dashed var(--line2); border-radius: var(--radius); padding: 34px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; max-width: 780px; }
  .card h3 { margin: 0 0 10px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  /* The record panel docks beside the list instead of covering it, so the list stays in view. */
  .scrim { display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; background: var(--bg); border-left: 1px solid var(--line); z-index: 11; display: flex; flex-direction: column; }
  .drawer header { background: var(--bg); border-bottom: 1px solid var(--line); padding: 16px 20px 0; }
  .drawer header .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .drawer header h2 { font-size: 18px; }
  .drawer header .tabsline { display: flex; gap: 18px; margin-top: 12px; }
  .drawer header .tabsline button { border: 0; background: none; padding: 8px 0; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
  .drawer header .tabsline button.on { color: var(--ink); border-color: var(--ink); font-weight: 500; }
  .drawer .body { overflow: auto; padding: 18px 20px 40px; flex: 1; }
  .drawer .card { max-width: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .spacer { flex: 1; }
  .counter { font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .counter.over { color: var(--danger); font-weight: 600; }
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
  .log li:last-child { border-bottom: 0; }
  .log time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; z-index: 30; font-size: 13px; }
  pre.sample { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; overflow: auto; margin: 8px 0 0; }
  nav .short { display: none; }
  table.plain tbody tr { cursor: default; }
  th.check, td.check { width: 40px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--inv); vertical-align: middle; }
  .checkline { display: flex; gap: 8px; align-items: center; color: var(--ink); font-size: 14px; margin: 0; }
  .field { margin-bottom: 12px; }
  .actionbar { position: sticky; bottom: 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 0; margin-top: 12px; }
  .yes { color: var(--good); font-weight: 600; }

  /* Top bar: one box to search everything. */
  .topbar { display: flex; gap: 10px; align-items: center; margin: -10px 0 18px; }
  .topbar input[type=search] { flex: 1; width: auto; padding: 9px 12px; background: var(--panel); }
  /* Record panel pieces */
  .why-list { list-style: none; margin: 0; padding: 0; }
  .why-list li { padding: 2px 0; }
  .why-list li::before { content: "+"; color: var(--hot); margin-right: 8px; font-weight: 600; }
  .letter { white-space: pre-wrap; line-height: 1.6; }
  .writer { font-size: 12px; color: var(--muted); }
  /* Today */
  .acts { border: 1px solid var(--line); border-radius: var(--radius); max-width: 860px; }
  .act { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .act:last-child { border-bottom: 0; }
  .act .n { width: 22px; height: 22px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .act p { margin: 0; } .act small { color: var(--muted); }

  /* Phones: bottom tab bar, cards instead of tables, full-screen drawer, 44px touch targets. */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    .app { display: block; }
    nav { position: fixed; left: 0; right: 0; top: auto; bottom: 0; height: auto; z-index: 9; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(64px, 1fr); overflow-x: auto; gap: 2px;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-right: 0; border-top: 1px solid var(--line); }
    nav h1, nav p, nav .mode, nav .long { display: none; }
    nav .short { display: inline; }
    nav button { flex-direction: column-reverse; align-items: center; justify-content: center; gap: 0; min-height: 50px; padding: 4px 2px; font-size: 12px; }
    nav .count { font-size: 11px; line-height: 14px; min-height: 14px; }
    main { padding: 18px 14px calc(96px + env(safe-area-inset-bottom)); }
    h2 { font-size: 22px; }
    input[type=text], input[type=email], input[type=url], input[type=search], input[type=number], select, textarea { font-size: 16px; padding: 10px 12px; }
    .btn, a.btn { min-height: 44px; padding: 10px 14px; display: inline-flex; align-items: center; justify-content: center; }
    .btn.small { min-height: 42px; padding: 8px 12px; font-size: 14px; }
    .tabs { display: flex; width: 100%; }
    .tabs button { flex: 1; min-height: 44px; padding: 8px 4px; }
    .bar .grow { display: none; }
    .bar input[type=search] { width: 100%; order: 5; }
    .bar .btn { flex: 1; }
    .stages { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; }
    .stage { flex: 0 0 104px; scroll-snap-align: start; }
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { position: relative; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    tr:last-child { border-bottom: 0; }
    td { padding: 2px 0; border: 0; }
    td.fit { max-width: none; }
    td:empty { display: none; }
    td.check { position: absolute; top: 10px; right: 10px; width: auto; padding: 6px; }
    tr.pick td:not(.check) { padding-right: 44px; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 14px; }
    .drawer { width: 100vw; border-left: 0; }
    body.docked .app { display: block; }
    .drawer .body { padding: 14px 14px 48px; }
    .row .btn { flex: 1 1 auto; }
    .spacer { display: none; }
    .counter { margin-left: 0; }
    .toast { bottom: calc(84px + env(safe-area-inset-bottom)); max-width: 90vw; text-align: center; }
    .actionbar { bottom: calc(62px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div class="app">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LI_NOTE_LIMIT = 300;

let S = null;                       // server state
let view = "today";
let filter = { kind: "all", stage: "all", q: "" };
let open = null;                    // { id, tab }
let notice = "";

async function call(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  if (res.status === 401) { window.location.href = "/login"; throw new Error("Sign in again."); }
  const data = await res.json();
  if (data.contacts) S = data;
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

const safeUrl = (raw) => {
  const v = String(raw || "").trim();
  if (!v) return "";
  const withScheme = /^https?:\/\//i.test(v) ? v : "https://" + v;
  try { const u = new URL(withScheme); return ["http:", "https:"].includes(u.protocol) ? u.href : ""; } catch { return ""; }
};
const linkedinSearch = (c) => {
  const terms = c.name ? `${c.name} ${c.org}` : `${c.org} ${c.role || (c.kind === "investor" ? "partner" : c.kind === "partner" ? "partnerships" : "organizer")}`;
  return "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(terms.trim());
};
const daysSince = (iso) => (iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null);
const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const followups = () => {
  const limit = Number(S.settings.followup_days) || 5;
  return S.contacts.filter((c) => c.stage === "Contacted" && daysSince(c.last_contacted) !== null && daysSince(c.last_contacted) >= limit);
};
const title = (c) => c.org || c.name || "Untitled";
const person = (c) => [c.org ? c.name : "", c.role].filter(Boolean).join(", ");

// ---------- navigation ----------

function renderNav() {
  const items = [
    ["today", "Today", "Today", todayActions().length, true],
    ["pipeline", "Pipeline", "Pipeline", S.contacts.length],
    ["find", "Find leads", "Find", ""],
    ["leads", "All leads", "Leads", (S.allLeads || []).filter((l) => !inPipeline(l)).length],
    ["followups", "Follow-ups", "Follow-ups", followups().length],
    ["import", "Import", "Import", ""],
    ["settings", "Your pitch", "Pitch", ""],
  ];
  $("#nav").innerHTML = `
    <h1>Bridge Outreach</h1>
    <p>Investors, partners, conferences, communities</p>
    ${items.map(([id, label, short, n, isNew]) => `<button data-view="${id}" class="${view === id ? "on" : ""}" ${view === id ? 'aria-current="page"' : ""}><span><span class="long">${label}</span><span class="short">${short}</span>${isNew ? `<span class="new">new</span>` : ""}</span><span class="count">${n || ""}</span></button>`).join("")}
    <div class="mode">Drafts: ${S.ai ? `written by ${esc(S.aiModel)}` : "template (add an API key for AI)"}<br>Gmail: ${S.gmail.connected ? "connected" : "not connected"}</div>`;
  $("#nav").querySelectorAll("button").forEach((b) => (b.onclick = () => { view = b.dataset.view; notice = ""; if (open) { open = null; $("#overlay").innerHTML = ""; document.body.classList.remove("docked"); } render(); }));
}

// ---------- pipeline ----------

function visibleContacts() {
  const q = filter.q.toLowerCase();
  return S.contacts.filter((c) =>
    (filter.kind === "all" || c.kind === filter.kind) &&
    (filter.stage === "all" || c.stage === filter.stage) &&
    (!q || [c.org, c.name, c.role, c.fit, c.notes].join(" ").toLowerCase().includes(q)));
}

const TABLE_HEAD = "<thead><tr><th>Who</th><th>Score</th><th>Type</th><th>Why they fit</th><th>Have</th><th>Stage</th><th>Last contact</th></tr></thead>";

function contactRows(list) {
  return list.map((c) => {
    const d = daysSince(c.last_contacted);
    return `<tr data-id="${c.id}" class="${open && open.id === c.id ? "sel" : ""}">
      <td><div class="org">${esc(title(c))}</div><div class="who">${esc(person(c)) || "No person yet"}</div></td>
      <td>${grade(rateLead(c))}</td>
      <td><span class="pill ${c.kind}">${c.kind}</span></td>
      <td class="fit">${esc(c.fit)}</td>
      <td class="have"><i class="${c.email ? "yes" : ""}">email</i><i class="${c.linkedin ? "yes" : ""}">LinkedIn</i><i class="${c.email_body ? "yes" : ""}">draft</i></td>
      <td><span class="pill s-${c.stage}">${c.stage}</span></td>
      <td class="who">${d === null ? "" : d === 0 ? "today" : d + "d ago"}</td>
    </tr>`;
  }).join("");
}

function renderPipeline() {
  const pool = S.contacts.filter((c) => filter.kind === "all" || c.kind === filter.kind);
  const list = visibleContacts();
  $("#main").innerHTML = `
    <h2>Pipeline</h2>
    <p class="sub">Everyone you want to reach. Open a row to find the right person, draft the email and LinkedIn message, and log what you sent.</p>
    <div class="stages">
      ${S.stages.map((s) => `<button class="stage ${filter.stage === s ? "on" : ""}" data-stage="${s}"><b>${pool.filter((c) => c.stage === s).length}</b><span>${s}</span></button>`).join("")}
    </div>
    <div class="bar">
      <div class="tabs">${["all", ...S.kinds].map((k) => `<button data-kind="${k}" class="${filter.kind === k ? "on" : ""}">${{ all: "All", investor: "Investors", partner: "Partners", conference: "Conferences", community: "Communities" }[k] || k}</button>`).join("")}</div>
      <input type="search" id="q" placeholder="Search" aria-label="Search contacts" value="${esc(filter.q)}">
      <span class="grow"></span>
      ${S.gmail.connected ? `<button class="btn" id="sync">Check Gmail</button>` : ""}
      <a class="btn" href="/api/export.csv">Export CSV</a>
      <button class="btn primary" id="add">Add contact</button>
    </div>
    <div id="list"></div>`;
  $("#main").querySelectorAll("[data-stage]").forEach((b) => (b.onclick = () => { filter.stage = filter.stage === b.dataset.stage ? "all" : b.dataset.stage; render(); }));
  $("#main").querySelectorAll("[data-kind]").forEach((b) => (b.onclick = () => { filter.kind = b.dataset.kind; render(); }));
  $("#q").oninput = (e) => { filter.q = e.target.value; renderList(visibleContacts()); };
  $("#add").onclick = () => { open = { id: "new", tab: "details" }; renderDrawer(); };
  const sync = $("#sync");
  if (sync) sync.onclick = async () => {
    sync.disabled = true; sync.textContent = "Checking...";
    try { toast(syncSummary((await call("POST", "/api/gmail/sync", {})).found)); }
    catch (e) { toast(e.message); }
    render();
  };
  renderList(list);
}

const syncSummary = (found) => {
  const parts = [];
  if (found.sent) parts.push(`${found.sent} sent`);
  if (found.replies) parts.push(`${found.replies} repl${found.replies === 1 ? "y" : "ies"}`);
  return parts.length ? `Gmail: ${parts.join(", ")} found` : "Gmail: nothing new";
};

function renderList(list) {
  $("#list").innerHTML = list.length
    ? `<table>${TABLE_HEAD}<tbody>${contactRows(list)}</tbody></table>`
    : `<div class="empty"><b>${S.contacts.length ? "Nothing matches these filters" : "No contacts yet"}</b>${S.contacts.length ? "Clear the search or pick another stage." : "Add your first investor or partner, or paste a list on the Import page."}</div>`;
  bindRows();
}

function bindRows() {
  $("#main").querySelectorAll("tr[data-id]").forEach((tr) => (tr.onclick = () => { open = { id: Number(tr.dataset.id), tab: "outreach" }; notice = ""; render(); renderDrawer(); }));
}

// ---------- find leads ----------

let find = {
  tab: "investor", loaded: null, rows: [], at: null, picked: new Set(), note: "", busy: false, balance: null,
  investor: { query: "AI meeting facilitation, group collaboration and collective intelligence software", count: 5, early: true },

// Search results are saved on the server per tab, so a reload or tab switch shows the last search again.
function loadSavedResults() {
  const saved = (S.leadResults || {})[find.tab];
  find.loaded = find.tab;
  find.rows = saved ? saved.rows : [];
  find.at = saved ? saved.at : null;
  find.picked = new Set(find.rows.map((r, i) => (inPipeline(r) ? -1 : i)).filter((i) => i >= 0));
  if (saved && saved.search) {
    if (find.tab === "investor") find.investor = { ...find.investor, ...saved.search };
    else find[find.tab] = { ...find[find.tab], ...saved.search };
  }
}

let balanceLoading = false;
async function loadBalance() {

let leadsView = { q: "", kind: "all", status: "new", category: "all", picked: new Set() };

// Category comes from the person's role; the score adds up signals that make a lead worth reaching first.
const DECIDER = /\b(founder|co-?founder|ceo|chief|president|owner|managing (partner|director)|general partner|gp|partner|principal|head|vp|vice president|director|chair)\b/i;
const INFLUENCER = /\b(manager|lead|senior|sr\.?|associate|investor|analyst|program|producer|curator|coordinator|organi[sz]er|events?|community|partnerships?)\b/i;
function rateLead(l) {
  const why = [];
  let score = 0;
  let category = "Firm only";
  if (l.name) {
    if (DECIDER.test(l.role || "")) { category = "Decision maker"; score += 35; why.push("Decision maker role +35"); }
    else if (INFLUENCER.test(l.role || "")) { category = "Influencer"; score += 22; why.push("Influencer role +22"); }
    else { category = "Contact"; score += 12; why.push("Named contact +12"); }
    if (l.linkedin) { score += 15; why.push("LinkedIn profile +15"); }
    if (l.email_available || l.email) { score += 20; why.push("Email available +20"); }
  } else {
    score += 5; why.push("Organisation only, no person yet +5");
  }
  if ((l.fit || "").trim().length > 10) { score += 15; why.push("Clear reason they fit +15"); }
  if (l.website) { score += 5; why.push("Website known +5"); }
  const repeats = Math.min(Math.max((l.times_found || 1) - 1, 0), 2);
  if (repeats) { score += repeats * 5; why.push(`Found by ${repeats + 1} searches +${repeats * 5}`); }
  score = Math.min(score, 100);
  const tier = score >= 70 ? "Hot" : score >= 45 ? "Warm" : "Cold";
  return { score, tier, category, why };
}
const CATEGORIES = ["Decision maker", "Influencer", "Contact", "Firm only"];
const grade = (r) => `<span class="score ${r.tier.toLowerCase()}" title="${esc(r.why.join("\n"))}">${r.score}<i>${r.tier}</i></span>`;

function visibleLeads() {
  const q = leadsView.q.toLowerCase();
  return (S.allLeads || []).filter((l) =>
    (leadsView.kind === "all" || l.kind === leadsView.kind) &&
    (leadsView.status === "all" || (leadsView.status === "pipeline") === inPipeline(l)) &&
    (leadsView.category === "all" || rateLead(l).category === leadsView.category) &&
    (!q || [l.org, l.name, l.role, l.fit, l.search].join(" ").toLowerCase().includes(q)))
    .sort((a, b) => rateLead(b).score - rateLead(a).score);
}

// The few things worth doing now, best first: replies, due follow-ups, the best people not yet written to, then fresh hot leads.
function todayActions() {
  if (!S) return [];
  const acts = [];
  for (const c of S.contacts.filter((x) => x.stage === "Replied")) {
    acts.push({ rank: 0, id: c.id, text: `${c.name || title(c)} replied`, sub: `${title(c)} · ${c.kind}`, button: "Open" });
  }
  for (const c of followups()) {
    acts.push({ rank: 1, id: c.id, text: `Follow up with ${c.name || title(c)}, ${daysSince(c.last_contacted)} days since you wrote`, sub: `${title(c)} · ${c.kind}`, button: "Open" });
  }
  S.contacts.filter((c) => ["Research", "Ready"].includes(c.stage)).map((c) => ({ c, r: rateLead(c) }))
    .sort((a, b) => b.r.score - a.r.score).slice(0, 4)
    .forEach(({ c, r }) => acts.push({ rank: 2, id: c.id, text: `Write to ${c.name || title(c)}`, sub: `${title(c)} · ${c.kind} · score ${r.score} ${r.tier}`, button: c.email_body ? "Open draft" : "Write" }));
  const hot = (S.allLeads || []).filter((l) => !inPipeline(l) && rateLead(l).tier === "Hot");
  if (hot.length) acts.push({ rank: 3, view: "leads", text: `${hot.length} hot lead${hot.length === 1 ? "" : "s"} not in your pipeline yet`, sub: "From your searches", button: "Review" });
  return acts.sort((a, b) => a.rank - b.rank).slice(0, 8);
}

    <div class="${area ? "wide" : ""}"><label for="s_${key}">${label}</label>
    ${area ? `<textarea id="s_${key}">${esc(s[key])}</textarea>` : `<input type="text" id="s_${key}" value="${esc(s[key])}">`}
    ${hint ? `<p class="hint">${hint}</p>` : ""}</div>`;
  $("#main").innerHTML = `
    <h2>Your pitch</h2>
    <p class="sub">Every draft is built from what you write here plus what you know about the person. The more specific this is, the less each draft needs editing.</p>
    <div class="card"><h3>Who is writing</h3><div class="grid">
      ${field("founder_name", "Your name")}${field("founder_title", "Your title")}
      ${field("company", "Company")}${field("link", "Link to share")}
    </div></div>
    <div class="card"><h3>What you say</h3><div class="grid">
      ${field("pitch", "What the company does, in two or three sentences", "", true)}
      ${field("proof", "Proof points", "Real numbers or names only: pilots run, waitlist size, notable users. Leave empty if there are none yet.", true)}
    </div></div>
    <div class="card"><h3>What you ask for</h3><div class="grid">
      ${field("investor_ask", "From investors", "", true)}
      ${field("partner_ask", "From partners", "", true)}
      ${field("conference_ask", "From conferences", "", true)}
      ${field("community_ask", "From communities", "", true)}
      <div><label for="s_followup_days">Follow up after this many days</label><input type="number" min="1" id="s_followup_days" value="${esc(s.followup_days)}"></div>
    </div></div>
    <div class="row" style="margin-top:0"><button class="btn primary" id="save">Save</button>${S.auth ? `<span class="spacer"></span><a class="btn" href="/logout">Sign out</a>` : ""}</div>
    <div class="card" style="margin-top:22px"><h3>Gmail</h3>
      ${S.gmail.connected ? `
        <div>Connected${S.gmail.address ? " as " + esc(S.gmail.address) : ""}. Drafts can be saved straight into this inbox, and the pipeline updates when a draft is sent or a reply arrives.</div>
        <p class="hint">This app can create drafts and read your mail to spot sends and replies. It cannot send email.</p>
        <div class="row"><button class="btn danger" id="gdisconnect">Disconnect Gmail</button></div>`
      : S.gmail.configured ? `
        <div>Connect Gmail to save drafts straight into your inbox and to have replies update the pipeline automatically.</div>
        <p class="hint">Google will ask for permission to create drafts and read your mail. This app cannot send email.</p>
        <div class="row"><a class="btn primary" href="/auth/google">Connect Gmail</a></div>`
      : `
        <div>Gmail is not set up yet. It needs a Google sign-in client, which takes about ten minutes to create once:</div>
        <ol class="hint" style="font-size:13px;padding-left:18px;margin:8px 0 0">
          <li>In Google Cloud Console, create a project and enable the Gmail API.</li>
          <li>Set up the consent screen and add yourself as a test user.</li>
          <li>Create an OAuth client of type "Web application" with this redirect URI: <code>${esc(S.gmail.redirect)}</code></li>
          <li>Put the client ID and secret in the app's <code>.env</code> file as <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code>, then restart the app.</li>
        </ol>`}
    </div>`;
  const gd = $("#gdisconnect");
  if (gd) gd.onclick = async () => {
    if (!confirm("Disconnect Gmail? Drafts already saved stay in your inbox.")) return;
    await call("POST", "/api/gmail/disconnect"); toast("Gmail disconnected"); render();
  };
  $("#save").onclick = async () => {
    const body = {};
    Object.keys(s).forEach((k) => { const el = $("#s_" + k); if (el) body[k] = el.value; });
    await call("PUT", "/api/settings", body);
    toast("Saved"); render();
  };
}

// ---------- contact drawer ----------

function closeDrawer() { open = null; notice = ""; $("#overlay").innerHTML = ""; document.body.classList.remove("docked"); render(); }

function detailsForm(c) {
  const f = (key, label, type = "text", wide = false, area = false, hint = "") => `
    <div class="${wide ? "wide" : ""}"><label for="f_${key}">${label}</label>
    ${area ? `<textarea id="f_${key}">${esc(c[key])}</textarea>` : `<input type="${type}" id="f_${key}" value="${esc(c[key])}">`}
    ${hint ? `<p class="hint">${hint}</p>` : ""}</div>`;
  return `<div class="card"><div class="grid">
      <div><label for="f_kind">Type</label><select id="f_kind">${S.kinds.map((k) => `<option ${c.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select></div>
      <div><label for="f_stage">Stage</label><select id="f_stage">${S.stages.map((s) => `<option ${c.stage === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      ${f("org", "Organisation (firm, company or event)")}${f("website", "Website")}
      ${f("name", "Person")}${f("role", "Their role")}
      ${f("email", "Email", "email")}${f("linkedin", "LinkedIn profile URL")}
      ${f("fit", "Why they fit", "text", true, true, "One or two sentences. This is what makes the draft specific to them.")}
      ${f("warm_path", "Warm path", "text", true, false, "Who can introduce you, if anyone. Leave empty for a cold message.")}
      ${f("notes", "Notes", "text", true, true)}
    </div>
    <div class="row">
      <button class="btn primary" id="savec">${c.id ? "Save" : "Add contact"}</button>
      ${c.id ? `<span class="spacer"></span><button class="btn danger" id="delc">Delete</button>` : ""}
    </div></div>`;
}

function outreachPanel(c) {
  const li = safeUrl(c.linkedin);
  const site = safeUrl(c.website);
  const noteLen = (c.li_note || "").length;
  const hasDraft = c.email_body || c.li_note || c.li_message;
  return `
    ${notice ? `<div class="notice">${esc(notice)}</div>` : ""}
    ${(() => { const r = rateLead(c); return `<div class="card"><h3>Why they scored ${r.score} ${grade(r)}</h3><ul class="why-list">${r.why.map((w) => `<li>${esc(w.replace(/ \+\d+$/, ""))}</li>`).join("")}</ul><p class="hint">${r.category}</p></div>`; })()}
    <div class="card">
      <h3>1. Find the right person</h3>
      ${c.name ? `<div>${esc(c.name)}${c.role ? ", " + esc(c.role) : ""} at ${esc(c.org || "their organisation")}</div>` : `<div>No person recorded yet for ${esc(title(c))}.</div>`}
      <div class="row">
        ${li ? `<a class="btn small" target="_blank" rel="noopener" href="${esc(li)}">Open LinkedIn profile</a>` : ""}
        <a class="btn small" target="_blank" rel="noopener" href="${esc(linkedinSearch(c))}">${c.name ? "Search LinkedIn for them" : "Search LinkedIn for who to contact"}</a>
        ${site ? `<a class="btn small" target="_blank" rel="noopener" href="${esc(site)}">Website</a>` : ""}
        ${!c.email && S.leads.enabled && (c.linkedin || c.name) ? `<button class="btn small" id="findemail">Find email · ${money(S.leads.pricePerLookup)}</button>` : ""}
        <button class="btn small" data-tab="details">Edit details</button>
      </div>
      ${!c.fit ? `<p class="hint">Add a line under "Why they fit" before drafting. Without it the message will read as generic.</p>` : ""}
    </div>
    <div class="card">
      <h3>2. Draft</h3>
      <div class="row" style="margin-top:0">
        <button class="btn primary" id="gen">${hasDraft ? "Rewrite drafts" : "Write drafts"}</button>
        ${S.ai && hasDraft ? `<button class="btn small" data-style="warmer">Warmer</button><button class="btn small" data-style="shorter">Shorter</button><button class="btn small" data-style="plainer">Plainer</button>` : ""}
      </div>
      <p class="hint">${S.ai ? `Written by ${esc(S.aiModel)} from your pitch and this person's details, then checked for phrases that sound machine-written.` : "Built from a template using your pitch and this person's details."} Edit freely; changes save when you click away.</p>
    </div>
    <div class="card">
      <h3>3. Email</h3>
      <label for="d_email_subject">Subject</label><input type="text" id="d_email_subject" value="${esc(c.email_subject)}">
      <label for="d_email_body" style="margin-top:10px">Body</label><textarea id="d_email_body" style="min-height:230px">${esc(c.email_body)}</textarea>
      <div class="row">
        ${S.gmail.connected ? `<button class="btn small primary" id="gdraft" ${c.email ? "" : "disabled"}>${c.gmail_draft_at ? "Save to Gmail drafts again" : "Save to Gmail drafts"}</button>` : ""}
        <button class="btn small" id="gmail" ${c.email ? "" : "disabled"}>Open in Gmail</button>
        <button class="btn small" id="mailapp" ${c.email ? "" : "disabled"}>Open in mail app</button>
        <button class="btn small" id="copyemail">Copy</button>
        <span class="spacer"></span>
        <button class="btn small" data-log="email">Mark email sent</button>
      </div>
      ${c.email ? "" : `<p class="hint">Add their email under Edit details to open this straight in your mail.</p>`}
      ${S.gmail.connected && c.gmail_draft_at && c.stage !== "Contacted" ? `<p class="hint">Saved to your Gmail drafts on ${fmtDate(c.gmail_draft_at)}. <a href="https://mail.google.com/mail/#drafts" target="_blank" rel="noopener">Open drafts</a> to review and send; this contact moves to Contacted once it is sent.</p>` : ""}
    </div>
    <div class="card">
      <h3>4. LinkedIn</h3>
      <p class="hint" style="margin:0 0 10px">LinkedIn does not allow tools to send messages for you, so this copies the text and opens their profile. You paste and send.</p>
      <label for="d_li_note">Connection request note</label><textarea id="d_li_note">${esc(c.li_note)}</textarea>
      <div class="row">
        <button class="btn small" id="copynote">${li ? "Copy and open profile" : "Copy"}</button>
        <span class="counter ${noteLen > LI_NOTE_LIMIT ? "over" : ""}" id="notecount">${noteLen} / ${LI_NOTE_LIMIT}</span>
        <button class="btn small" data-log="linkedin_note">Mark request sent</button>
      </div>
      <label for="d_li_message" style="margin-top:14px">Message once connected</label><textarea id="d_li_message" style="min-height:130px">${esc(c.li_message)}</textarea>
      <div class="row">
        <button class="btn small" id="copymsg">${li ? "Copy and open profile" : "Copy"}</button>
        <span class="spacer"></span>
        <button class="btn small" data-log="linkedin_message">Mark message sent</button>
      </div>
    </div>
    <div class="card">
      <h3>5. What happened</h3>
      <div class="row" style="margin-top:0">
        <button class="btn small" data-log="reply">They replied</button>
        <button class="btn small" data-log="meeting">Meeting booked</button>
        <button class="btn small" id="passed">Passed</button>
      </div>
    </div>`;
}

function activityPanel(c) {
  const items = S.activity.filter((a) => a.contact_id === c.id);
  return `<div class="card">
      <h3>Add a note</h3>
      <textarea id="notetext" aria-label="Note" placeholder="What was said, what to do next"></textarea>
      <div class="row"><button class="btn small" id="addnote">Add note</button></div>
    </div>
    <div class="card"><h3>History</h3>
      ${items.length ? `<ul class="log">${items.map((a) => `<li><span>${esc(a.summary)}</span><time>${fmtDate(a.at)}</time></li>`).join("")}</ul>` : `<div class="who">Nothing logged yet.</div>`}
    </div>`;
}

function renderDrawer() {
  if (!open) return;
  const isNew = open.id === "new";
  const c = isNew
    ? { kind: filter.kind === "all" ? "investor" : filter.kind, stage: "Research", org: "", name: "", role: "", email: "", linkedin: "", website: "", fit: "", warm_path: "", notes: "" }
    : S.contacts.find((x) => x.id === open.id);
  if (!c) { open = null; $("#overlay").innerHTML = ""; document.body.classList.remove("docked"); return; }
  document.body.classList.add("docked");
  const tabs = isNew ? [["details", "Details"]] : [["outreach", "Outreach"], ["details", "Details"], ["activity", "History"]];
  const scroll = $("#overlay .body")?.scrollTop || 0;
  $("#overlay").innerHTML = `
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" role="dialog" aria-label="Contact">
      <header>
        <div class="top">
          <div><h2>${isNew ? "New contact" : esc(title(c))}</h2>
            ${isNew ? "" : `<div class="who">${esc(person(c))} <span class="pill ${c.kind}">${c.kind}</span> <span class="pill s-${c.stage}">${c.stage}</span></div>`}</div>
          <button class="btn small" id="close">Close</button>
        </div>
        <div class="tabsline">${tabs.map(([id, label]) => `<button data-tab="${id}" class="${open.tab === id ? "on" : ""}">${label}</button>`).join("")}</div>
      </header>
      <div class="body">${open.tab === "details" ? detailsForm(c) : open.tab === "activity" ? activityPanel(c) : outreachPanel(c)}</div>
    </aside>`;
  const O = $("#overlay");
  $(".body", O).scrollTop = scroll;
  $("#scrim").onclick = closeDrawer;
  $("#close").onclick = closeDrawer;
  O.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { open.tab = b.dataset.tab; notice = ""; renderDrawer(); $(".body", O).scrollTop = 0; }));

  if (open.tab === "details") {
    $("#savec").onclick = async () => {
      const body = {};
      ["kind", "stage", "org", "website", "name", "role", "email", "linkedin", "fit", "warm_path", "notes"].forEach((k) => (body[k] = $("#f_" + k).value));
      try {
        if (isNew) { const r = await call("POST", "/api/contacts", body); open = { id: r.contact.id, tab: "outreach" }; }
        else { await call("PUT", `/api/contacts/${c.id}`, body); open.tab = "outreach"; }
        toast("Saved"); render(); renderDrawer();
      } catch (e) { toast(e.message); }
    };
    const del = $("#delc");
    if (del) del.onclick = async () => {
      if (!confirm(`Delete ${title(c)} and its history? This cannot be undone.`)) return;
      await call("DELETE", `/api/contacts/${c.id}`); closeDrawer(); toast("Deleted");
    };
    return;
  }

  if (open.tab === "activity") {
    $("#addnote").onclick = async () => {
      const text = $("#notetext").value.trim();
      if (!text) return;
      await call("POST", `/api/contacts/${c.id}/sent`, { channel: "note", summary: text });
      render(); renderDrawer();
    };
    return;
  }

  // Outreach tab
  const saveField = async (key, value) => { if (value !== c[key]) { await call("PUT", `/api/contacts/${c.id}`, { [key]: value }); c[key] = value; } };
  ["email_subject", "email_body", "li_note", "li_message"].forEach((k) => ($("#d_" + k).onblur = (e) => saveField(k, e.target.value)));
  $("#d_li_note").oninput = (e) => {
    const n = e.target.value.length, el = $("#notecount");
    el.textContent = `${n} / ${LI_NOTE_LIMIT}`; el.classList.toggle("over", n > LI_NOTE_LIMIT);
  };
  const write = async (btn, style) => {
    O.querySelectorAll("#gen, [data-style]").forEach((b) => (b.disabled = true));
    btn.textContent = "Writing...";
    try { const r = await call("POST", `/api/contacts/${c.id}/draft`, style ? { style } : undefined); notice = r.warning || ""; }
    catch (err) { notice = err.message; }
    render(); renderDrawer();
  };
  $("#gen").onclick = (e) => write(e.target, "");
  O.querySelectorAll("[data-style]").forEach((b) => (b.onclick = () => write(b, b.dataset.style)));
  const copy = async (text, label) => { try { await navigator.clipboard.writeText(text); toast(label); } catch { toast("Could not copy. Select the text and copy it by hand."); } };
  const li = safeUrl(c.linkedin);
  $("#copyemail").onclick = () => copy(`${$("#d_email_subject").value}\n\n${$("#d_email_body").value}`, "Email copied");
  $("#copynote").onclick = async () => { await copy($("#d_li_note").value, "Note copied"); if (li) window.open(li, "_blank", "noopener"); };
  $("#copymsg").onclick = async () => { await copy($("#d_li_message").value, "Message copied"); if (li) window.open(li, "_blank", "noopener"); };
  const compose = () => ({ to: c.email, su: $("#d_email_subject").value, body: $("#d_email_body").value });
  const findemail = $("#findemail");
  if (findemail) findemail.onclick = async () => {
    findemail.disabled = true; findemail.textContent = "Looking...";
    try {
      const r = await call("POST", `/api/contacts/${c.id}/find-email`);
      notice = r.found ? "" : "No verified email was found for this person, so nothing was charged.";
      if (r.found) toast(`Email found. Charged ${money(r.charge)}.`);
    } catch (e) { notice = e.message; }
    render(); renderDrawer();
  };
  const gdraft = $("#gdraft");
  if (gdraft) gdraft.onclick = async () => {
    gdraft.disabled = true; gdraft.textContent = "Saving...";
    const m = compose();
    try { await call("POST", `/api/contacts/${c.id}/gmail-draft`, { email_subject: m.su, email_body: m.body }); notice = ""; toast("Saved to Gmail drafts"); }
    catch (e) { notice = e.message; }
    render(); renderDrawer();
  };
  $("#gmail").onclick = () => { const m = compose(); window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(m.to)}&su=${encodeURIComponent(m.su)}&body=${encodeURIComponent(m.body)}`, "_blank", "noopener"); };
  $("#mailapp").onclick = () => { const m = compose(); window.location.href = `mailto:${encodeURIComponent(m.to)}?subject=${encodeURIComponent(m.su)}&body=${encodeURIComponent(m.body)}`; };
  O.querySelectorAll("[data-log]").forEach((b) => (b.onclick = async () => {
    await call("POST", `/api/contacts/${c.id}/sent`, { channel: b.dataset.log });
    toast("Logged"); render(); renderDrawer();
  }));
  $("#passed").onclick = async () => { await call("PUT", `/api/contacts/${c.id}`, { stage: "Passed" }); toast("Marked as passed"); render(); renderDrawer(); };
}

// ---------- boot ----------

function render() {
  renderNav();
  ({ today: renderToday, pipeline: renderPipeline, find: renderFind, leads: renderAllLeads, followups: renderFollowups, import: renderImport, settings: renderSettings })[view]();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && open) closeDrawer(); });
call("GET", "/api/state")
  .then(async () => {
    render();
    if (!S.gmail.connected) return;
    // Quiet background check on load so sends and replies show up without a click.
    const { found } = await call("POST", "/api/gmail/sync", { auto: true });
    if (found.sent || found.replies) { toast(syncSummary(found)); render(); }
  })
  .catch((e) => { if (!S) $("#main").textContent = e.message; });
</script>
</body>
</html>
